x<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heatline — live heat risk, mapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#14171A;
    --panel:#1D2124;
    --panel-2:#242830;
    --border:rgba(242,237,228,0.10);
    --border-strong:rgba(242,237,228,0.20);
    --text:#F2EDE4;
    --text-muted:#9CA0A5;
    --caution:#F2C14E;
    --caution-ink:#4A3B0A;
    --exc:#F28C28;
    --exc-ink:#4A2C05;
    --danger:#E63946;
    --danger-ink:#4A0F14;
    --extreme:#8B1E3F;
    --extreme-ink:#F2EDE4;
    --safe:#3EC6B3;
    --safe-ink:#08302C;
    --radius:10px;
    --font-display:'Archivo Black', 'Barlow', sans-serif;
    --font-body:'Barlow', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:14px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:1000;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-size:20px;
    letter-spacing:0.5px;
    margin:0;
    color:var(--text);
  }
  .brand span{
    font-size:12px;
    color:var(--text-muted);
    font-family:var(--font-mono);
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  .header-controls input[type=password]{
    background:var(--bg);
    border:1px solid var(--border-strong);
    color:var(--text);
    padding:8px 10px;
    border-radius:var(--radius);
    font-family:var(--font-mono);
    font-size:12px;
    width:200px;
  }
  .header-controls input[type=password]::placeholder{color:var(--text-muted);}
  button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:transparent;
    color:var(--text);
    padding:8px 14px;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  button:hover{background:rgba(242,237,228,0.06);}
  button:active{transform:scale(0.97);}
  button.primary{
    background:var(--exc);
    color:var(--exc-ink);
    border-color:var(--exc);
  }
  button.primary:hover{filter:brightness(1.08);}
  .key-status{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .key-status.ok{color:var(--safe);}
  .coming-soon{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    border:1px dashed var(--border-strong);
    padding:6px 10px;
    border-radius:var(--radius);
    white-space:nowrap;
  }

  /* ---------- Map area ---------- */
  #map-wrap{
    position:relative;
    flex:1;
    min-height:0;
  }
  #map{
    width:100%;
    height:100%;
    background:var(--bg);
  }

  /* ---------- Search overlay ---------- */
  .search-box{
    position:absolute;
    top:16px;
    left:16px;
    z-index:900;
    display:flex;
    gap:8px;
  }
  .search-box input{
    background:var(--panel);
    border:1px solid var(--border-strong);
    color:var(--text);
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:14px;
    width:220px;
  }
  .search-box input::placeholder{color:var(--text-muted);}

  /* ---------- Conditions panel ---------- */
  #conditions{
    position:absolute;
    top:16px;
    right:16px;
    z-index:900;
    width:280px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
  }
  #conditions .place{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
  }
  #conditions .coords{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    margin:0 0 14px;
  }
  .temp-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .temp-big{
    font-family:var(--font-display);
    font-size:44px;
    line-height:1;
  }
  .temp-unit-toggle{
    display:flex;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    overflow:hidden;
    margin-left:auto;
  }
  .temp-unit-toggle button{
    border:none;
    border-radius:0;
    padding:5px 9px;
    font-size:11px;
  }
  .temp-unit-toggle button.active{background:var(--text);color:var(--bg);}
  .hi-label{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:14px;
  }
  .risk-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:var(--radius);
    font-weight:700;
    font-size:13px;
    margin-bottom:12px;
  }
  .risk-dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .advice{
    font-size:13px;
    line-height:1.5;
    color:var(--text);
    margin:0 0 14px;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-muted);
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  #conditions .empty{
    font-size:13px;
    color:var(--text-muted);
    line-height:1.6;
  }
  #locate-btn{
    width:100%;
    margin-top:12px;
  }

  /* ---------- Signature: risk gauge legend ---------- */
  #gauge{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:900;
    width:min(640px, calc(100vw - 32px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 18px 10px;
  }
  #gauge .gauge-title{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .gauge-track{
    position:relative;
    height:10px;
    border-radius:6px;
    background:linear-gradient(90deg,
      var(--safe) 0%, var(--safe) 21%,
      var(--caution) 21%, var(--caution) 36%,
      var(--exc) 36%, var(--exc) 54%,
      var(--danger) 54%, var(--danger) 86%,
      var(--extreme) 86%, var(--extreme) 100%);
  }
  .gauge-marker{
    position:absolute;
    top:-6px;
    width:2px;
    height:22px;
    background:var(--text);
    transform:translateX(-1px);
    transition:left 0.4s ease;
  }
  .gauge-marker::after{
    content:'';
    position:absolute;
    top:-5px;
    left:-4px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--text);
  }
  .gauge-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:10px;
    color:var(--text-muted);
    font-family:var(--font-mono);
  }
  .gauge-labels span{flex:1;text-align:center;}
  .gauge-labels span:first-child{text-align:left;}
  .gauge-labels span:last-child{text-align:right;}

  @media (max-width: 720px){
    #conditions{
      top:auto;
      bottom:120px;
      right:16px;
      left:16px;
      width:auto;
    }
    .search-box{right:16px;}
    .search-box input{width:100%;}
    #gauge{width:calc(100vw - 32px);}
    .header-controls input[type=password]{width:140px;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>HEATLINE</h1>
      <span>live heat risk, mapped</span>
    </div>
    <div class="header-controls">
      <span class="coming-soon" title="Care package requests and partner network, launching next">Care packages — coming soon</span>
      <span id="key-status" class="key-status ok">live data connected</span>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search a city or ZIP" />
      <button id="search-btn" class="primary">Go</button>
    </div>

    <div id="conditions">
      <p class="empty">Search a location or click the map to see current heat risk.</p>
    </div>

    <div id="gauge">
      <div class="gauge-title">
        <span>HEAT INDEX RISK SCALE</span>
        <span id="gauge-reading">— °F</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-marker" id="gauge-marker" style="left:6%"></div>
      </div>
      <div class="gauge-labels">
        <span>Low</span>
        <span>Caution</span>
        <span>Extreme caution</span>
        <span>Danger</span>
        <span>Extreme danger</span>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  // NOTE: embedded directly per request. This key is visible to anyone who
  // views this page's source — fine for a prototype/internal demo, but swap
  // to a server-side proxy before this goes public so the key can't be
  // scraped and used by someone else on your OpenWeather account/quota.
var OPENWEATHER_API_KEY = "";
  var state = {
    apiKey: OPENWEATHER_API_KEY,
    unit: 'F',
    map: null,
    tempLayer: null,
    marker: null,
    lastReading: null
  };

  /* ---------- Heat index (NWS Rothfusz regression, °F) ---------- */
  function heatIndexF(tempF, rh){
    if (tempF < 80) return tempF;
    var T = tempF, R = rh;
    var hi = -42.379 + 2.04901523*T + 10.14333127*R - 0.22475541*T*R
      - 0.00683783*T*T - 0.05481717*R*R + 0.00122874*T*T*R
      + 0.00085282*T*R*R - 0.00000199*T*T*R*R;
    if (R < 13 && T >= 80 && T <= 112){
      hi -= ((13-R)/4) * Math.sqrt((17-Math.abs(T-95))/17);
    } else if (R > 85 && T >= 80 && T <= 87){
      hi += ((R-85)/10) * ((87-T)/5);
    }
    return hi;
  }

  function riskCategory(hi){
    if (hi < 80) return { key:'safe', label:'Low risk', color:'var(--safe)', ink:'var(--safe-ink)',
      range:'Below 80°F',
      advice:'No significant heat risk. Normal precautions apply for prolonged outdoor activity.' };
    if (hi <= 90) return { key:'caution', label:'Caution', color:'var(--caution)', ink:'var(--caution-ink)',
      range:'80°F – 90°F',
      advice:'Fatigue is possible with long outdoor time or heavy work.' };
    if (hi <= 103) return { key:'exc', label:'Extreme caution', color:'var(--exc)', ink:'var(--exc-ink)',
      range:'91°F – 103°F',
      advice:'Heat cramps and heat exhaustion are possible.' };
    if (hi <= 124) return { key:'danger', label:'Danger', color:'var(--danger)', ink:'var(--danger-ink)',
      range:'103°F – 124°F',
      advice:'Heat stroke is likely with continued outdoor exposure.' };
    return { key:'extreme', label:'Extreme danger', color:'var(--extreme)', ink:'var(--extreme-ink)',
      range:'125°F and up',
      advice:'Heat stroke is highly likely. Stay indoors in air conditioning and check on neighbors who may be vulnerable.' };
  }

  function gaugePercent(hi){
    var pct = ((hi - 65) / (135 - 65)) * 100;
    return Math.max(2, Math.min(98, pct));
  }

  /* ---------- Unit helpers ---------- */
  function fToC(f){ return (f - 32) * 5/9; }
  function displayTemp(f){
    return state.unit === 'F' ? Math.round(f) + '°F' : Math.round(fToC(f)) + '°C';
  }

  /* ---------- Map ---------- */
  var FOCUS_RADIUS_METERS = 804.672; // 0.5 mile

  function initMap(){
    state.map = L.map('map', { zoomControl:true, attributionControl:true })
      .setView([39.5, -98.35], 4);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom:18
    }).addTo(state.map);

    state.map.on('click', function(e){
      fetchConditions(e.latlng.lat, e.latlng.lng, null);
    });

    addTempLayer();
    goToUserLocation(true);
  }

  // Computes the zoom level at which the map container's diagonal — corner
  // to corner — corresponds to `radiusMeters`. That guarantees every pixel
  // on screen, including the corners, sits within that real-world radius
  // of the center point (not just a circle floating inside a wider view).
  function zoomForFullScreenRadius(lat, radiusMeters){
    var size = state.map.getSize(); // {x: width px, y: height px}
    var halfDiagonalPx = Math.sqrt(Math.pow(size.x / 2, 2) + Math.pow(size.y / 2, 2));
    var metersPerPixel = radiusMeters / halfDiagonalPx;
    var latRad = lat * Math.PI / 180;
    return Math.log2((156543.03392 * Math.cos(latRad)) / metersPerPixel);
  }

  function focusOnRadius(lat, lon){
    var zoom = zoomForFullScreenRadius(lat, FOCUS_RADIUS_METERS);
    zoom = Math.min(zoom, state.map.getMaxZoom());
    state.map.setView([lat, lon], zoom, { animate:true });
  }

  function goToUserLocation(silentFallback){
    if (!navigator.geolocation){
      if (!silentFallback) renderLocateError();
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      focusOnRadius(lat, lon);
      fetchConditions(lat, lon, 'Your location', { skipFlyTo:true });
    }, function(){
      if (!silentFallback) renderLocateError();
      // silent fallback: keep the default continental view, let the user
      // search or click "Use my location" manually.
    }, { enableHighAccuracy:true, timeout:8000 });
  }

  function renderLocateError(){
    document.getElementById('conditions').innerHTML =
      '<p class="empty">Couldn\'t get your location. Try searching instead, or click "Use my location" to allow access.</p>';
  }

  function addTempLayer(){
    if (!state.apiKey || !state.map) return;
    if (state.tempLayer) state.map.removeLayer(state.tempLayer);
    state.tempLayer = L.tileLayer(
      'https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=' + state.apiKey,
      { opacity:0.55, maxZoom:18 }
    ).addTo(state.map);
  }

  /* ---------- Conditions panel ---------- */
  function renderConditions(data){
    var panel = document.getElementById('conditions');
    if (!data){
      panel.innerHTML = '<p class="empty">Search a location or click the map to see current heat risk.</p>';
      return;
    }
    var risk = riskCategory(data.hi);
    var unitToggle =
      '<div class="temp-unit-toggle">' +
        '<button data-unit="F" class="' + (state.unit==='F'?'active':'') + '">°F</button>' +
        '<button data-unit="C" class="' + (state.unit==='C'?'active':'') + '">°C</button>' +
      '</div>';

    panel.innerHTML =
      '<p class="place">' + escapeHtml(data.name) + '</p>' +
      '<p class="coords">' + data.lat.toFixed(3) + ', ' + data.lon.toFixed(3) + '</p>' +
      '<div class="temp-row"><span class="temp-big">' + displayTemp(data.tempF) + '</span>' + unitToggle + '</div>' +
      '<p class="hi-label">Feels like (heat index): ' + displayTemp(data.hi) + '</p>' +
      '<div class="risk-badge" style="background:' + risk.color + ';color:' + risk.ink + ';">' +
        '<span class="risk-dot"></span>' + risk.label + ' &middot; ' + risk.range +
      '</div>' +
      '<p class="advice">' + risk.advice + '</p>' +
      '<div class="meta-row"><span>Humidity ' + Math.round(data.humidity) + '%</span><span>Updated just now</span></div>';

    document.querySelectorAll('.temp-unit-toggle button').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.unit = btn.getAttribute('data-unit');
        renderConditions(data);
      });
    });

    updateGauge(data.hi);
  }

  function updateGauge(hi){
    document.getElementById('gauge-marker').style.left = gaugePercent(hi) + '%';
    document.getElementById('gauge-reading').textContent = displayTemp(hi) + ' heat index';
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- API calls ---------- */
  function fetchConditions(lat, lon, label, opts){
    opts = opts || {};
    if (!state.apiKey) return;
    var panel = document.getElementById('conditions');
    panel.innerHTML = '<p class="empty">Loading conditions…</p>';

    var url = 'https://api.openweathermap.org/data/2.5/weather?lat=' + lat + '&lon=' + lon +
      '&units=imperial&appid=' + state.apiKey;

    fetch(url).then(function(r){
      if (!r.ok) throw new Error('weather lookup failed');
      return r.json();
    }).then(function(json){
      var tempF = json.main.temp;
      var humidity = json.main.humidity;
      var hi = heatIndexF(tempF, humidity);
      var name = label || (json.name ? json.name + (json.sys && json.sys.country ? ', ' + json.sys.country : '') : lat.toFixed(2) + ', ' + lon.toFixed(2));

      var data = { name:name, lat:lat, lon:lon, tempF:tempF, humidity:humidity, hi:hi };
      state.lastReading = data;
      renderConditions(data);

      if (state.marker) state.map.removeLayer(state.marker);
      state.marker = L.circleMarker([lat, lon], {
        radius:8, color:'#F2EDE4', weight:2, fillColor:riskCategory(hi).color, fillOpacity:0.9
      }).addTo(state.map);

      if (!opts.skipFlyTo){
        state.map.flyTo([lat, lon], Math.max(state.map.getZoom(), 8), { duration:0.6 });
      }
    }).catch(function(err){
      panel.innerHTML = '<p class="empty">Couldn\'t load conditions for that location. Check your API key or try again.</p>';
    });
  }

  // OpenWeather's city-name geocoder doesn't understand postal codes, so
  // route anything that looks like a ZIP/postal code to its separate zip
  // endpoint instead. Supports "94040" (assumes US) or "94040,CA" style.
  var ZIP_PATTERN = /^\s*(\d{3,10}|[A-Za-z0-9]{3,4}\s?\d[A-Za-z0-9]{2,3})\s*(?:,\s*([A-Za-z]{2}))?\s*$/;

  function searchLocation(query){
    if (!state.apiKey || !query) return;
    var panel = document.getElementById('conditions');
    panel.innerHTML = '<p class="empty">Searching…</p>';

    var zipMatch = query.match(ZIP_PATTERN);
    if (zipMatch && /\d/.test(zipMatch[1])){
      var zip = zipMatch[1].trim();
      var country = zipMatch[2] ? zipMatch[2].toUpperCase() : 'US';
      searchByZip(zip, country, query);
      return;
    }

    var url = 'https://api.openweathermap.org/geo/1.0/direct?q=' + encodeURIComponent(query) +
      '&limit=1&appid=' + state.apiKey;

    fetch(url).then(function(r){
      if (!r.ok) throw new Error('geocode failed');
      return r.json();
    }).then(function(results){
      if (!results || !results.length){
        panel.innerHTML = '<p class="empty">No location found for "' + escapeHtml(query) + '". Try a city name or ZIP code.</p>';
        return;
      }
      var loc = results[0];
      var label = loc.name + (loc.state ? ', ' + loc.state : '') + (loc.country ? ', ' + loc.country : '');
      focusOnRadius(loc.lat, loc.lon);
      fetchConditions(loc.lat, loc.lon, label, { skipFlyTo:true });
    }).catch(function(){
      panel.innerHTML = '<p class="empty">Search failed. Check your API key or try again.</p>';
    });
  }

  function searchByZip(zip, country, originalQuery){
    var panel = document.getElementById('conditions');
    var url = 'https://api.openweathermap.org/geo/1.0/zip?zip=' + encodeURIComponent(zip) +
      ',' + encodeURIComponent(country) + '&appid=' + state.apiKey;

    fetch(url).then(function(r){
      if (!r.ok) throw new Error('zip lookup failed');
      return r.json();
    }).then(function(loc){
      var label = loc.name + (loc.country ? ', ' + loc.country : '');
      focusOnRadius(loc.lat, loc.lon);
      fetchConditions(loc.lat, loc.lon, label, { skipFlyTo:true });
    }).catch(function(){
      panel.innerHTML = '<p class="empty">No location found for "' + escapeHtml(originalQuery) +
        '". For non-US postal codes, try "code, country" (e.g. "K1A 0B1, CA").</p>';
    });
  }

  document.getElementById('search-btn').addEventListener('click', function(){
    searchLocation(document.getElementById('search-input').value.trim());
  });
  document.getElementById('search-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  });

  /* ---------- Locate button ---------- */
  var locateBtn = document.createElement('button');
  locateBtn.id = 'locate-btn';
  locateBtn.textContent = 'Use my location';
  document.getElementById('conditions').after(locateBtn);
  locateBtn.style.position = 'absolute';
  locateBtn.style.top = '16px';
  locateBtn.style.right = '16px';
  locateBtn.style.display = 'none';

  function positionLocateBtn(){
    var panel = document.getElementById('conditions');
    var rect = panel.getBoundingClientRect();
    var wrapRect = document.getElementById('map-wrap').getBoundingClientRect();
    locateBtn.style.top = (rect.bottom - wrapRect.top + 10) + 'px';
    locateBtn.style.right = '16px';
    locateBtn.style.width = rect.width + 'px';
    locateBtn.style.display = 'block';
  }
  window.addEventListener('resize', positionLocateBtn);

  locateBtn.addEventListener('click', function(){
    goToUserLocation(false);
  });

  initMap();
  setTimeout(positionLocateBtn, 300);
})();
</script>
</body>
</html>
